name: CI

# run on pushes to main and on every PR targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest

    # every `run` step executes inside client/ — this is a monorepo
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

          cache-dependency-path: client/package-lock.json

      # `ci` installs exactly what the lockfile says and wipes node_modules first
      - run: npm ci

      - run: npm run lint

      # `build` runs `tsc -b` first, so type-checking is covered here
      - run: npm run build

  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chinstein_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: chinstein_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U chinstein_test -d chinstein_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://chinstein_test:test-only-password@127.0.0.1:5433/chinstein_test
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Apply test database schema
        run: npm run migrate

      - name: Run server tests
        run: npm test

      - name: Type-check server and tests
        run: npm run test:typecheck

      - name: Build server
        run: npm run build
