name: chinstein-v2-test
services:
  test-db:
    image: postgres:17

    environment:
      POSTGRES_USER: chinstein_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: chinstein_test

    ports:
      - "5433:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chinstein_test -d chinstein_test
      interval: 2s
      timeout: 3s
      retries: 10

    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro